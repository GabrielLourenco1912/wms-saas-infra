services:

  mysql:
    image: mysql:8.0
    container_name: wms-saas-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  backend:
    user: "1001:1001"
    build:
      context: ./wms-saas-backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: wms-saas-backend
    expose:
      - "8080"
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      API_SECURITY_JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    restart: on-failure

volumes:
  db_data:
