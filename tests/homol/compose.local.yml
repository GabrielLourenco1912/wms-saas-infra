# Explicit local/CI override. Never used by the host's production deployment.
services:
  backend:
    image: wms-homol-backend:local
    build:
      context: ./wms-saas-backend
      dockerfile: ../docker/backend/Dockerfile
    environment:
      REFRESH_COOKIE_SECURE: 'false'
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3333
  web:
    image: wms-homol-web:local
    build:
      context: ./wms-saas-web
      dockerfile: ../docker/web/Dockerfile
    environment:
      WEB_ORIGIN: http://127.0.0.1:3333
  mysql-backup:
    image: wms-homol-backup:local
    build:
      context: ./docker/mysql-backup
    volumes:
    - ${WMS_TEST_BACKUP_DIR:?}:/backups
