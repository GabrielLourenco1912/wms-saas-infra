name: Backup MySQL

on:
  push:
    branches: [main]
    paths:
      - docker/mysql-backup/**
      - docker-compose.yml
      - .env.example
      - wms-saas-backend
      - .github/workflows/mysql-backup.yml
  pull_request:
    branches: [main]
    paths:
      - docker/mysql-backup/**
      - docker-compose.yml
      - .env.example
      - wms-saas-backend
      - .github/workflows/mysql-backup.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysql-backup-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# For private submodules, configure SUBMODULES_TOKEN with Contents: read on
# this repository and its submodules. GHCR uses the job's GITHUB_TOKEN.
jobs:
  integration:
    name: Backup, restauração e cron em MySQL descartável
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout da infraestrutura e das migrations do WMS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}
          persist-credentials: false

      - name: Validar sintaxe
        run: bash -n docker/mysql-backup/mysql-backup docker/mysql-backup/tests/integration.sh

      - name: Executar integração
        run: bash docker/mysql-backup/tests/integration.sh

  publish:
    name: Publicar imagem de backup no GHCR
    needs: integration
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout da infraestrutura
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Definir imagem
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wms-saas-mysql-backup" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Autenticar no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publicar backup MySQL após os testes
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker/mysql-backup
          file: docker/mysql-backup/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mysql-backup
          cache-to: type=gha,scope=mysql-backup,mode=max
